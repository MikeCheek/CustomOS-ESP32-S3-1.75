; PlatformIO build of the watch firmware (pioarduino: Arduino core 3.3.12
; on ESP-IDF 5.5). Same sources as the Arduino IDE build (firmware/), plus
; an ESP-IDF configuration the prebuilt Arduino core can't have:
;
;   - power management: the CPU clock scales down to 40 MHz and the chip
;     light-sleeps on its own whenever every task is waiting (tickless idle)
;   - Bluetooth modem sleep: the radio sleeps between connection events,
;     so the watch can light-sleep while staying connected to the phone
;
; firmware/hal_power.cpp turns these on while the screen is off (see
; power_update_sleep_policy()). The first build compiles the Arduino core's
; libraries for this configuration and takes several minutes; later builds
; are incremental.
;
;   pip install "platformio==6.2.0"    (what CI uses; this platform needs >= 6.2.0)
;   pio run                 build
;   pio run -t upload       build and flash over USB
;   pio device monitor      serial log

[platformio]
src_dir = firmware
lib_dir = firmware/libraries
boards_dir = boards
default_envs = watch

[env:watch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = waveshare-s3-amoled-175
board_build.partitions = partitions/app3M_fat9M_16MB.csv   ; same table as the Arduino IDE build
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; firmware/libraries holds the three vendored libraries (lib_dir above)
build_src_filter = +<*> -<libraries/>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DPIO_BUILD=1
    ; JPEGDEC builds its fs::File functions only if FS.h is reachable
    ; (__has_include), which the LDF doesn't count as a dependency
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; Same versions as scripts/arduino-libraries.txt (the Arduino IDE / CI build)
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    moononournation/GFX Library for Arduino@1.6.8
    bitbank2/JPEGDEC@1.8.4
    h2zero/NimBLE-Arduino@2.5.0
    knolleary/PubSubClient@2.8
    lewisxhe/SensorLib@0.4.1
    mikalhart/TinyGPSPlus@1.0.3
    lewisxhe/XPowersLib@0.3.3
; chain+: each library's own includes are followed too (WiFi -> Networking)
lib_ldf_mode = chain+

custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
    CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
    ; PSRAM up at boot like the stock qio_opi core (the rebuild starts from
    ; the generic sdkconfig, which leaves it to Arduino's later psramInit())
    CONFIG_SPIRAM_BOOT_HW_INIT=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
