# Builds the watch firmware and the companion app on every push and pull
# request. A tag like v2.9.0 also makes a GitHub release with both files.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  ESP32_CORE: "3.3.10"
  FQBN: "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc"

jobs:
  # The release firmware: PlatformIO (pioarduino) with power management,
  # tickless idle and Bluetooth modem sleep compiled in (platformio.ini).
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The first build compiles the Arduino core's libraries for our
      # sdkconfig (several minutes); the cache makes later ones incremental.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}-${{ github.sha }}
          restore-keys: |
            pio-${{ hashFiles('platformio.ini', 'boards/*.json') }}-

      - name: Install PlatformIO
        # pioarduino 55.03.311 needs 6.1.19; 6.2 ships an SCons it breaks on
        run: pip install "platformio==6.1.19"

      - name: Check FW_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/diag.h)
          tag=${GITHUB_REF_NAME#v}
          echo "FW_VERSION=$fw tag=$tag"
          test "$fw" = "$tag"

      - name: Build
        run: |
          pio run -e watch 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" = 0
          grep -E "^(RAM|Flash):" build.log >> "$GITHUB_STEP_SUMMARY" || true
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/diag.h)
          cp .pio/build/watch/firmware.bin "AmoledSmartWatchOS-$fw.bin"

      # The watch only installs signed updates when a key is set in
      # ota_pubkey.h; it then downloads the *.signed.bin from the release.
      - name: Sign the firmware (if the OTA_PRIVATE_KEY secret is set)
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY" ]; then echo "No OTA_PRIVATE_KEY secret - unsigned build only"; exit 0; fi
          pip install --quiet cryptography
          printf '%s\n' "$OTA_PRIVATE_KEY" > "$RUNNER_TEMP/ota_private.pem"
          python3 scripts/sign_firmware.py AmoledSmartWatchOS-*.bin "$RUNNER_TEMP/ota_private.pem"
          rm -f "$RUNNER_TEMP/ota_private.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: AmoledSmartWatchOS-*.bin

  # The Arduino IDE build (prebuilt core, no power management): kept
  # compiling so the sketch still opens and builds in the IDE. Releases use
  # the PlatformIO build below.
  firmware-arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ESP32_CORE }}-${{ hashFiles('scripts/arduino-libraries.txt') }}

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          # Pinned registry libraries (the three non-registry ones are vendored in libraries/)
          grep -v '^#' scripts/arduino-libraries.txt | grep -v '^$' | while read -r lib; do
            arduino-cli lib install "$lib"
          done

      - name: Compile
        run: |
          # The sketch is firmware/firmware.ino (folder and .ino share a name)
          arduino-cli compile -b "$FQBN" --libraries firmware/libraries \
            --warnings default --build-path build firmware 2>&1 | tee compile.log
          grep -E "Sketch uses|Global variables" compile.log >> "$GITHUB_STEP_SUMMARY"
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/diag.h)
          cp build/firmware.ino.bin "AmoledSmartWatchOS-$fw-arduino.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino
          path: AmoledSmartWatchOS-*.bin

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The app pins an NDK (android/app/build.gradle.kts ndkVersion) that the
      # runner doesn't have; Gradle can't install it without accepting the
      # SDK licenses (one of them is the "preview" license), so do it here.
      - name: Install the Android NDK
        working-directory: .
        run: |
          # The app's NDK, plus Flutter's default one that plugins (e.g. jni)
          # build with - otherwise Gradle downloads it mid-build, and a bad
          # download there fails the job ("Archive is not a ZIP archive").
          NDKS=$( { grep -oP 'ndkVersion\s*=\s*"\K[^"]+' companion_app/android/app/build.gradle.kts
                    grep -rhoP 'ndkVersion\s*(:\s*String)?\s*=\s*"\K[0-9.]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle" ; } 2>/dev/null | sort -u)
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for NDK in $NDKS; do
            echo "Installing NDK $NDK"
            for try in 1 2 3; do
              yes | "$SDKM" --install "ndk;$NDK" > /dev/null && break
              [ $try = 3 ] && exit 1
              echo "retrying"; rm -rf "$ANDROID_HOME/ndk/$NDK"; sleep 10
            done
          done

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings   # errors fail the build; tighten later

      # The app updates itself from releases (lib/services/update_service.dart):
      # its version is FW_VERSION, and Android only installs an update
      # signed with the same key - set the ANDROID_KEYSTORE_BASE64 (base64 of
      # a .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
      # ANDROID_KEY_PASSWORD secrets, or every build gets a new debug key.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' ../firmware/diag.h)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -di > "$KS"
            export ANDROID_KEYSTORE_PATH="$KS"
            # Check the keystore before a 6-minute build finds out. Values are
            # trimmed (a trailing newline in a pasted secret is a common slip).
            export ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
            export ANDROID_KEY_PASSWORD="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"
            alias_want="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n' | xargs)"
            if ! listing=$(keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1); then
              echo "::error::Can't open the keystore in ANDROID_KEYSTORE_BASE64 with ANDROID_KEYSTORE_PASSWORD: $(echo "$listing" | tail -1)"
              exit 1
            fi
            aliases=$(echo "$listing" | grep -i 'PrivateKeyEntry' | cut -d, -f1)
            match=$(echo "$aliases" | grep -ixF -- "$alias_want" | head -1)
            if [ -n "$match" ]; then
              export ANDROID_KEY_ALIAS="$match"
            elif [ "$(echo "$aliases" | grep -c .)" = 1 ]; then
              echo "::warning::ANDROID_KEY_ALIAS doesn't match the keystore - using its only key, '$aliases'. Update the secret to that name."
              export ANDROID_KEY_ALIAS="$aliases"
            else
              echo "::error::ANDROID_KEY_ALIAS isn't a key in the keystore. Keys found: $(echo $aliases)"
              exit 1
            fi
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the APK can't update a previous build in place"
          fi
          flutter build apk --debug --android-skip-build-dependency-validation \
            --build-name="$fw" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-debug.apk "AmoledWatch-$fw.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: companion_app/AmoledWatch-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/*.bin
            app/*.apk
