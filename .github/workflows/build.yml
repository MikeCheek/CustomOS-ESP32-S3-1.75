# Builds the watch firmware and the companion app on every push and pull
# request. A tag like v2.9.0 also makes a GitHub release with both files.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  ESP32_CORE: "3.3.10"
  FQBN: "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc"

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ESP32_CORE }}-${{ hashFiles('scripts/arduino-libraries.txt') }}

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          # Pinned registry libraries (the three non-registry ones are vendored in libraries/)
          grep -v '^#' scripts/arduino-libraries.txt | grep -v '^$' | while read -r lib; do
            arduino-cli lib install "$lib"
          done

      - name: Check FW_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/diag.h)
          tag=${GITHUB_REF_NAME#v}
          echo "FW_VERSION=$fw tag=$tag"
          test "$fw" = "$tag"

      - name: Compile
        run: |
          # The sketch is firmware/firmware.ino (folder and .ino share a name)
          arduino-cli compile -b "$FQBN" --libraries firmware/libraries \
            --warnings default --build-path build firmware 2>&1 | tee compile.log
          grep -E "Sketch uses|Global variables" compile.log >> "$GITHUB_STEP_SUMMARY"
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/diag.h)
          cp build/firmware.ino.bin "AmoledSmartWatchOS-$fw.bin"

      # The watch only installs signed updates when a key is set in
      # ota_pubkey.h; it then downloads the *.signed.bin from the release.
      - name: Sign the firmware (if the OTA_PRIVATE_KEY secret is set)
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY" ]; then echo "No OTA_PRIVATE_KEY secret - unsigned build only"; exit 0; fi
          pip install --quiet cryptography
          printf '%s\n' "$OTA_PRIVATE_KEY" > "$RUNNER_TEMP/ota_private.pem"
          python3 scripts/sign_firmware.py AmoledSmartWatchOS-*.bin "$RUNNER_TEMP/ota_private.pem"
          rm -f "$RUNNER_TEMP/ota_private.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: AmoledSmartWatchOS-*.bin

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The app pins an NDK (android/app/build.gradle.kts ndkVersion) that the
      # runner doesn't have; Gradle can't install it without accepting the
      # SDK licenses (one of them is the "preview" license), so do it here.
      - name: Install the Android NDK
        working-directory: .
        run: |
          NDK=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' companion_app/android/app/build.gradle.kts || true)
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          if [ -n "$NDK" ]; then
            echo "Installing NDK $NDK"
            yes | "$SDKM" --install "ndk;$NDK" > /dev/null
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings   # errors fail the build; tighten later

      - name: Build APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: companion_app/build/app/outputs/flutter-apk/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/*.bin
            app/app-debug.apk
