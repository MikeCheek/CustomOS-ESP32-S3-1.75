# Builds the watch firmware and the companion app on every push and pull
# request. A tag like v2.9.0 also makes a GitHub release with both files.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  ESP32_CORE: "3.3.10"
  FQBN: "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc"

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # arduino-cli wants the folder named like the .ino
          path: AmoledSmartWatchOS

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ESP32_CORE }}-${{ hashFiles('AmoledSmartWatchOS/scripts/arduino-libraries.txt') }}

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          # Pinned registry libraries (the three non-registry ones are vendored in libraries/)
          grep -v '^#' AmoledSmartWatchOS/scripts/arduino-libraries.txt | grep -v '^$' | while read -r lib; do
            arduino-cli lib install "$lib"
          done

      - name: Check FW_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' AmoledSmartWatchOS/diag.h)
          tag=${GITHUB_REF_NAME#v}
          echo "FW_VERSION=$fw tag=$tag"
          test "$fw" = "$tag"

      - name: Compile
        run: |
          arduino-cli compile -b "$FQBN" --libraries AmoledSmartWatchOS/libraries \
            --warnings default --build-path build --export-binaries AmoledSmartWatchOS 2>&1 | tee compile.log
          grep -E "Sketch uses|Global variables" compile.log >> "$GITHUB_STEP_SUMMARY"
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' AmoledSmartWatchOS/diag.h)
          cp build/AmoledSmartWatchOS.ino.bin "AmoledSmartWatchOS-$fw.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: AmoledSmartWatchOS-*.bin

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings   # errors fail the build; tighten later

      - name: Build APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: companion_app/build/app/outputs/flutter-apk/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/*.bin
            app/app-debug.apk
