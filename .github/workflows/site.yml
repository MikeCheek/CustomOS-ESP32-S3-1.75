# The landing page (site/: Vite + React + TypeScript + Tailwind) on GitHub
# Pages. Runs only when the site or the screenshots it shows change:
#  - a pull request touching them: builds it (a check, nothing published)
#  - a push to main touching them, or Actions > site > Run workflow: builds
#    and publishes to https://mikecheek.github.io/CustomOS-ESP32-S3-Amoled/
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # the GIFs become MP4s and the power-on frames for the scroll (scripts/media.mjs)
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
