name: amoled_companion
description: "Companion app for AmoledSmartWatchOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.0
  flutter_riverpod: ^2.6.0
  riverpod: ^2.6.0
  flutter_colorpicker: ^1.1.0
  permission_handler: ^11.3.0
  device_info_plus: ^11.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  uuid: ^4.5.0
  file_picker: ^8.0.0
  # Speech-to-text (whisper.cpp via FFI)
  whisper_ggml: ^2.4.0
  # On-device LLM (Gemma / Qwen / etc.)
  flutter_gemma: ^1.3.1
  flutter_gemma_litertlm: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
