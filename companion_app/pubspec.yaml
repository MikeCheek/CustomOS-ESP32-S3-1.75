name: amoled_companion
description: "Companion app for AmoledSmartWatchOS"
publish_to: 'none'
version: 3.4.0+1   # CI sets --build-name from FW_VERSION

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.0
  flutter_riverpod: ^2.6.0
  riverpod: ^2.6.0
  flutter_colorpicker: ^1.1.0
  permission_handler: ^11.3.0
  device_info_plus: ^11.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  uuid: ^4.5.0
  file_picker: ^8.0.0
  # Speech-to-text (whisper.cpp via FFI)
  whisper_ggml: ^2.4.0
  # On-device LLM (Gemma / Qwen / etc.)
  flutter_gemma: ^1.3.1
  flutter_gemma_litertlm: ^1.0.0
  # Who said what in a memo (speaker diarization, onnxruntime)
  sherpa_onnx: ^2.0.1
  archive: ^4.0.7
  # The watch emulator's native library (dart:ffi)
  ffi: ^2.1.0
  # Look: a photo from the camera or the gallery
  image_picker: ^1.1.2
  # Photo face: the photo's subject in front of the time (Android)
  google_mlkit_subject_segmentation: ^0.2.1
  # AI models: downloads that keep going in the background and after the app closes,
  # resume, retries and notifications (WorkManager on Android, URLSession on iOS)
  background_downloader: 9.6.4
  health: ^13.1.4
  barcode: ^2.2.9
  google_mlkit_barcode_scanning: ^0.16.1
  camera: ^0.12.2
  image: ^4.12.0
  gal: ^2.3.3
  share_plus: ^12.0.2
  # Text -> phonemes for the Piper voices (sherpa-onnx 2 no longer has espeak-ng built in)
  piper_phonemize: ^1.5.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


# connectivity_plus (needed by background_downloader) 7.1+ uses an iOS 26 SDK API
# (NWPath.isUltraConstrained) that Xcode 16 can't compile; 7.0.0 is the last one without it.
dependency_overrides:
  connectivity_plus: 7.0.0

flutter:
  uses-material-design: true
  # iOS: CocoaPods only - several plugins (whisper_ggml, ML Kit, ffmpeg) have no Swift
  # package, and the mix built the app for iOS 15.6 (the pods need 16)
  config:
    enable-swift-package-manager: false
  assets:
    - assets/logo.png
